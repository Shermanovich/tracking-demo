<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Growth Consulting</title>

    <!-- Google Tag Manager -->
    <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
    new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
    'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-XXXXXXX');</script>
    <!-- End Google Tag Manager -->

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #0f0f0f; color: #fff; }
        .hero { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 40px 20px; }
        h1 { font-size: 48px; margin-bottom: 20px; }
        p { font-size: 20px; color: #aaa; margin-bottom: 40px; max-width: 600px; }
        .btn { background: #4f46e5; color: #fff; padding: 16px 40px; border: none; border-radius: 8px; font-size: 18px; cursor: pointer; }
        .btn:hover { background: #4338ca; }
        form { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 400px; margin-top: 40px; }
        input { padding: 14px; border-radius: 8px; border: none; font-size: 16px; }
        .thanks { display: none; color: #4f46e5; font-size: 24px; margin-top: 20px; }
    </style>
</head>
<body>

    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-XXXXXXX"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->

    <div class="hero">
        <h1>Scale Your Business with Meta Ads</h1>
        <p>Data-driven Facebook & Instagram advertising that turns clicks into qualified leads and sales.</p>
        <button class="btn" onclick="handleCTA()">Get Free Strategy Call</button>

        <form id="leadForm" onsubmit="handleSubmit(event)">
            <input type="text" id="name" placeholder="Your Name" required>
            <input type="email" id="email" placeholder="Your Email" required>
            <button type="submit" class="btn">Book My Free Call</button>
        </form>

        <div class="thanks" id="thanks">Thank you! We'll be in touch soon.</div>
    </div>

    <script>
        // Показываем форму при клике на кнопку
        function handleCTA() {
            window.dataLayer = window.dataLayer || [];
            window.dataLayer.push({
                event: 'cta_click',
                button_text: 'Get Free Strategy Call'
            });
            document.getElementById('leadForm').style.display = 'flex';
        }

        // Отправка формы
        function handleSubmit(e) {
            e.preventDefault();
            window.dataLayer = window.dataLayer || [];
            window.dataLayer.push({
                event: 'lead_form_submit',
                user_name: document.getElementById('name').value,
                user_email: document.getElementById('email').value
            });
            document.getElementById('leadForm').style.display = 'none';
            document.getElementById('thanks').style.display = 'block';
        }
    </script>

</body>
</html>
